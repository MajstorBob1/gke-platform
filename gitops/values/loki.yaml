# Loki in single-binary mode, storing chunks and indexes in GCS.
# Access to the bucket comes from Workload Identity (see terraform/envs/dev/main.tf):
# the ServiceAccount monitoring/loki is granted roles/storage.objectAdmin on it.
deploymentMode: SingleBinary

loki:
  auth_enabled: false # single tenant
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: gcs
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: gcs
    bucketNames:
      chunks: gke-platform-25447-loki-dev # replaced by scripts/configure-gitops.sh
      ruler: gke-platform-25447-loki-dev
      admin: gke-platform-25447-loki-dev
  limits_config:
    retention_period: 168h # 7 days (the bucket also deletes objects after 14)
    allow_structured_metadata: true # needed for OTLP log ingestion
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: gcs

serviceAccount:
  create: true
  name: loki # must match the Workload Identity principal in Terraform

singleBinary:
  replicas: 1
  nodeSelector:
    cloud.google.com/gke-nodepool: system
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# Scalable-mode components off.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# The memcached caches default to several GiB of RAM: far too big for this cluster.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  nodeSelector:
    cloud.google.com/gke-nodepool: system

lokiCanary:
  enabled: false
test:
  enabled: false
